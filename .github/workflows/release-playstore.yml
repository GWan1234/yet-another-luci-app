name: Play Store Release (AAB Bundle)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality-gate:
    name: Quality Gate (Analyze & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

  build-playstore-aab:
    name: Build & Artifact Play Store AAB
    needs: quality-gate
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Keystore
        if: ${{ secrets.COMMUNITY_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.COMMUNITY_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Build Play Store Release AAB
        env:
          KEYSTORE_PATH: app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.COMMUNITY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COMMUNITY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.COMMUNITY_KEY_PASSWORD }}
        run: flutter build appbundle --release --flavor playstore --dart-define=FLAVOR=playstore

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playstore-aab-${{ github.ref_name }}
          path: build/app/outputs/bundle/playstoreRelease/app-playstore-release.aab
