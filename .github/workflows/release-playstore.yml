name: Play Store Release (AAB Bundle)

on:
  workflow_dispatch:
    inputs:
      enable_ads:
        description: 'Enable AdMob ads SDK in this build (true/false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  quality-gate:
    name: Quality Gate (Analyze & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

  build-playstore-aab:
    name: Build & Artifact Play Store AAB
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Keystore
        env:
          COMMUNITY_KEYSTORE_BASE64: ${{ secrets.COMMUNITY_KEYSTORE_BASE64 }}
        if: env.COMMUNITY_KEYSTORE_BASE64 != ''
        run: |
          echo "$COMMUNITY_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Build Play Store Release AAB
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.COMMUNITY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COMMUNITY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.COMMUNITY_KEY_PASSWORD }}
        run: flutter build appbundle --release --flavor playstore --dart-define=FLAVOR=playstore --dart-define=ENABLE_ADS=${{ github.event.inputs.enable_ads || 'false' }}

      - name: Generate Play Store Release Notes
        run: |
          echo "What's New:" > release_notes_playstore.txt
          echo "- OpenWrt router management with support for legacy OPKG and modern APK packages." >> release_notes_playstore.txt
          echo "- Hardware network topology view for DSA and Swconfig router models." >> release_notes_playstore.txt
          echo "- Firewall 3 and Firewall 4 rules manager." >> release_notes_playstore.txt
          echo "- WPA3-SAE wireless security badge classification." >> release_notes_playstore.txt
          echo "- General performance and stability improvements." >> release_notes_playstore.txt

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playstore-aab-${{ github.ref_name }}
          path: build/app/outputs/bundle/playstoreRelease/app-playstore-release.aab
