name: Community Release (GitHub Releases)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality-gate:
    name: Quality Gate (Analyze & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

  build-and-release-community:
    name: Build & Publish Community APK
    needs: quality-gate
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Keystore
        env:
          COMMUNITY_KEYSTORE_BASE64: ${{ secrets.COMMUNITY_KEYSTORE_BASE64 }}
        if: env.COMMUNITY_KEYSTORE_BASE64 != ''
        run: |
          echo "$COMMUNITY_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Build Community Release APK
        env:
          KEYSTORE_PATH: app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.COMMUNITY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COMMUNITY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.COMMUNITY_KEY_PASSWORD }}
        run: flutter build apk --release --flavor community --dart-define=FLAVOR=community

      - name: Generate Community Release Notes
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "${{ github.ref_name }}" | head -n 1)
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "## What's Changed in Community Build (${{ github.ref_name }})" > release_notes_community.md
          echo "" >> release_notes_community.md
          git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG..${{ github.ref_name }}" | \
            grep -vE -i "monetization|paywall|admob|bannerad|play billing|in_app_purchase|subscription|\bads\b|entitlement" >> release_notes_community.md || true

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-community-release.apk"
          bodyFile: "release_notes_community.md"
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
