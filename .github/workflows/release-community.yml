name: Community Release (GitHub Releases)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      official_build:
        description: 'Flag build as Verified Official Release (true/false)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_support_dev:
        description: 'Enable Support the Developer UI in build (true/false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  quality-gate:
    name: Quality Gate (Analyze & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install & Auto-Upgrade Dependencies
        run: flutter pub upgrade

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

  build-and-release-community:
    name: Build & Publish Community APK
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install & Auto-Upgrade Dependencies
        run: flutter pub upgrade

      - name: Setup Keystore
        env:
          COMMUNITY_KEYSTORE_BASE64: ${{ secrets.COMMUNITY_KEYSTORE_BASE64 }}
        if: env.COMMUNITY_KEYSTORE_BASE64 != ''
        run: |
          echo "$COMMUNITY_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Extract App Version
        id: version
        run: |
          RAW_VER=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
          TAG_VER="v${RAW_VER}"
          echo "TAG_VER=${TAG_VER}" >> $GITHUB_ENV
          echo "tag_ver=${TAG_VER}" >> $GITHUB_OUTPUT

      - name: Build Community Release APK
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.COMMUNITY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COMMUNITY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.COMMUNITY_KEY_PASSWORD }}
        run: flutter build apk --release --flavor community --dart-define=FLAVOR=community --dart-define=OFFICIAL_BUILD=${{ github.event.inputs.official_build || 'true' }} --dart-define=ENABLE_SUPPORT_DEV=${{ github.event.inputs.enable_support_dev || 'false' }}

      - name: Generate Community Release Notes
        run: |
          echo "## What's New in Yet Another LuCI App (${{ env.TAG_VER }})" > release_notes_community.md
          echo "" >> release_notes_community.md
          echo "### Highlights" >> release_notes_community.md
          echo "- **Open-Core & Apache 2.0**: Fully free and open-source under Apache License 2.0." >> release_notes_community.md
          echo "- **Unlimited Routers & No Ads**: Community build flavor includes unlimited router management with zero ads and zero paywall limits." >> release_notes_community.md
          echo "- **Smart Topology Engine**: Support for DSA and Swconfig OpenWrt network architecture models." >> release_notes_community.md
          echo "- **Dual Package Engine**: OPKG and APK (OpenWrt 24.10+) package manager compatibility." >> release_notes_community.md
          echo "- **Firewall 3 & 4 Support**: Unified rules interface supporting iptables (fw3) and nftables (fw4)." >> release_notes_community.md
          echo "- **WPA3-SAE Security Badges**: Precise wireless security classification (WPA3-SAE, WPA2/WPA3 Mixed, WPA2-PSK)." >> release_notes_community.md
          echo "- **RPC ACL Remediation**: Guided in-app package installation dialogs for missing OpenWrt RPC endpoints." >> release_notes_community.md

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-community-release.apk"
          bodyFile: "release_notes_community.md"
          tag: ${{ env.TAG_VER }}
          name: ${{ env.TAG_VER }}
          token: ${{ secrets.GITHUB_TOKEN }}
